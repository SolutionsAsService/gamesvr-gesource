name: Update Docker Hub Description

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    # Upstream Docker Hub/LacledesLAN GHCR publishing; skipped in forks without those secrets.
    if: github.repository_owner == 'LacledesLAN'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Update Docker HUB Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lacledeslan/gamesvr-gesource
          short-description: "Goldeneye Source Dedicated Server"
          readme-filepath: ./README.md
