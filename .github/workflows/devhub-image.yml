name: devhub image (ghcr)

on:
  push:
    branches: [ master ]
    paths:
      - devhub.Dockerfile
      - dist/linux/devhub-entrypoint.sh
      - .github/workflows/devhub-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Lint entrypoint
        run: bash -n dist/linux/devhub-entrypoint.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./devhub.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          tags: |
            ghcr.io/solutionsasservice/gamesvr-gesource:latest
            ghcr.io/solutionsasservice/gamesvr-gesource:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
